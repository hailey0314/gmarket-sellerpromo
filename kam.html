<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍서하 KAM 대시보드</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706;--pale:#eff6ff}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
header{background:#111827;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}header .sub{color:#9ca3af;font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto}.tab{padding:8px 16px;border-radius:8px;cursor:pointer;background:#1f2937;color:#d1d5db;font-weight:600}.tab.on{background:var(--blue);color:#fff}
.loader{display:flex;gap:8px;align-items:center;font-size:12px}.loader label{background:#374151;padding:6px 10px;border-radius:6px;cursor:pointer;color:#fff}.loader input{display:none}.loader .st{color:#fbbf24;max-width:360px}
main{padding:18px 24px;max-width:1500px;margin:0 auto}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}.g21{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g2,.g21,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.5px}.kpi .s{font-size:12px;color:var(--mute);margin-top:4px}.kpi .s b{font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.warn{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mute);font-weight:600;background:#f9fafb;position:sticky;top:0;cursor:pointer;user-select:none}
td:first-child,th:first-child{text-align:left}td.l,th.l{text-align:left}
tr.rt td{background:#fffbeb;color:#92400e}tr.tot td{font-weight:700;background:#f9fafb}
tbody tr.sel{background:var(--pale)}tbody tr.pick{cursor:pointer}tbody tr.pick:hover{background:#f3f4f6}
.bar{display:inline-block;height:8px;background:#dbeafe;border-radius:4px;width:70px;vertical-align:middle;margin-right:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bar.low i{background:var(--red)}.bar.mid i{background:var(--amber)}.bar.hi i{background:var(--green)}
.pts li{margin:4px 0;line-height:1.45}.pts{margin:0;padding-left:18px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:#f3f4f6;color:#374151;margin-right:4px}.tag.G{background:#dcfce7;color:#166534}.tag.A{background:#fee2e2;color:#991b1b}
.scroll{max-height:560px;overflow:auto}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}.tools input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:220px}.tools select{padding:6px;border:1px solid var(--line);border-radius:6px}
svg text{font-size:10px;fill:#6b7280}
.detail h2{margin:0 0 4px;font-size:17px}.detail .meta{color:var(--mute);font-size:12px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.mini div{background:#f9fafb;border-radius:8px;padding:8px 10px}.mini .k{font-size:11px;color:var(--mute)}.mini .v{font-size:15px;font-weight:700}
.legend span{display:inline-block;margin-right:12px;font-size:11px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.foot{color:var(--mute);font-size:11px;margin-top:16px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div><h1 id="title">홍서하 KAM 대시보드</h1><div class="sub" id="subtitle"></div></div>
  <div class="loader">
    <label>① KAM 실적 파일 불러오기<input type="file" id="fKam" accept=".xlsx,.xlsm"></label>
    <label>② 상품 관리파일 불러오기<input type="file" id="fProd" accept=".xlsx,.xlsm"></label>
    <span class="st" id="status"></span>
  </div>
  <div class="tabs"><div class="tab on" data-p="p1">① 요약</div><div class="tab" data-p="p2">② 셀러 상세</div></div>
</header>
<main>
<section id="p1" class="page on">
  <div class="grid g6" id="kpis"></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>일자별 타겟 vs 실적 (GMV, 백만원) <span class="legend"><span><i style="background:#93c5fd"></i>실적</span><span><i style="background:#1f2937"></i>타겟</span><span><i style="background:#fbbf24"></i>당일 실시간</span></span></h3><div id="dailyChart"></div></div>
    <div class="card"><h3>오늘의 포인트</h3><ul class="pts" id="points"></ul></div>
  </div>
  <div class="grid g21" style="margin-top:14px">
    <div class="card"><h3>일자별 실적 상세</h3><div class="scroll" id="dailyTable"></div></div>
    <div class="card"><h3>카테고리별 GMV (기간 누적)</h3><div class="scroll" id="catTable"></div></div>
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card"><h3>CR 사용 구조 (관리셀러 합계, 백만원)</h3><div id="crTot"></div></div>
    <div class="card"><h3>SA(광고) 사용 (관리셀러 합계, 백만원)</h3><div id="saTot"></div></div>
    <div class="card"><h3>운영 중 기획전 링크</h3><div class="scroll" style="max-height:220px" id="links"></div></div>
  </div>
</section>
<section id="p2" class="page">
  <div class="card">
    <div class="tools"><input id="q" placeholder="셀러명 / ID 검색"><select id="sortSel"><option value="T">월타겟 순</option><option value="rate">달성율 낮은 순</option><option value="gapAbs">부족분 큰 순</option><option value="ydGmv">전일 GMV 순</option><option value="crR">CR율 높은 순</option></select><span id="cnt" style="color:var(--mute)"></span></div>
    <div class="scroll" style="max-height:420px" id="sellerTable"></div>
  </div>
  <div class="card detail" style="margin-top:14px" id="detail"><div style="color:var(--mute)">위 표에서 셀러를 클릭하면 일별 추이·주력상품·딜·CR·SA 상세가 표시됩니다.</div></div>
</section>
<div class="foot" id="foot"></div>
</main>
<script>
const EMBED = null;
let D = EMBED; let selBiz=null; let sortKey='T'; let qtxt='';
// ---------- helpers ----------
const d2date = s => new Date(Math.round((s-25569)*86400000));
const WD=['일','월','화','수','목','금','토'];
const md = s => {const d=d2date(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`;};
const mdShort = s => {const d=d2date(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`;};
const nz = v => (typeof v==='number'&&isFinite(v))?v:0;
const mm = v => (nz(v)/1000).toLocaleString('ko-KR',{maximumFractionDigits:1,minimumFractionDigits:1}); // 천원→백만
const eok = v => (nz(v)/100000).toFixed(2)+'억';
const pct = (v,s=false) => {v=nz(v);const t=(v*100).toFixed(1)+'%';return s&&v>0?'+'+t:t;};
const cls = v => v>0?'up':(v<0?'dn':'');
const rateCls = r => r>=1?'hi':(r>=0.8?'mid':'low');
const barH = r => `<span class="bar ${rateCls(r)}"><i style="width:${Math.min(100,Math.max(0,r*100))}%"></i></span>${pct(r)}`;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visibleDays(){ // 기준일까지 + 실시간(별도)
  const base=D.m.b, rt=D.m.rt;
  const shown=D.daily.filter(x=>x[0]<=base);
  const rtRow=D.daily.find(x=>x[0]===rt && x[2]>0);
  return {shown, rtRow};
}
function dayIdx(){ // seller d[] index of base day & rt day
  const days=D.daily.filter(x=>x[0]<=D.m.rt).map(x=>x[0]);
  return {days, iBase:days.indexOf(D.m.b), iRt:days.indexOf(D.m.rt)};
}
function enrich(){
  const {iBase,iRt,days}=dayIdx(); const nDays=days.filter(d=>d<=D.m.b).length;
  const lastDay=D.daily[D.daily.length-1][0]; const monthDays=d2date(lastDay).getUTCDate();
  D.progress=nDays/monthDays;
  D.s.forEach(s=>{
    s.rate=s.T?s.C/s.T:0; s.gapAbs=Math.max(0,s.T-s.C);
    const yd=s.d[iBase]||[0,0,0,0]; s.ydTgt=yd[0]; s.ydGmv=yd[1]; s.ydRate=yd[0]?yd[1]/yd[0]:0; s.ydPy=yd[3]; s.ydYoy=(yd[1]&&yd[3])?yd[1]/yd[3]-1:0;
    const rt=iRt>=0?s.d[iRt]:null; s.rtGmv=rt?rt[1]:0;
    s.crR=s.C?s.cr[0]/s.C:0; s.saR=s.C?s.sa[0]/s.C:0; s.nrevR=s.C?s.N/s.C:0;
    s.cumT=s.d.slice(0,iBase+1).reduce((a,x)=>a+x[0],0); s.pace=s.cumT?s.C/s.cumT:0; // 일할 타겟 대비
  });
}
// ---------- summary ----------
function renderSummary(){
  const {shown,rtRow}=visibleDays(); const [T,G,PY,Y,TRT,TR]=D.mtd;
  const cum=D.summ[1], yd=D.summ[0], rt=D.summ[2];
  const cumRate=cum[1]?cum[2]/cum[1]:0, ydRate=yd[1]?yd[2]/yd[1]:0;
  const nrev=D.s.reduce((a,s)=>a+s.N,0), nrevT=D.s.reduce((a,s)=>a+s.NT,0);
  const k=[
    ['10월 누적 GMV',eok(G),`월타겟 ${eok(T)} · 달성 <b class="${rateCls(G/T)==='low'?'dn':'up'}">${pct(G/T)}</b> · 진척 ${pct(D.progress)}`],
    [`기간 누적 (${mdShort(D.m.ms)}~${mdShort(D.m.b)})`,eok(cum[2]),`일할타겟 ${eok(cum[1])} · 달성 <b class="${cumRate>=1?'up':'dn'}">${pct(cumRate)}</b> · YoY <b class="${cls(cum[4])}">${pct(cum[4],true)}</b>`],
    [`전일 ${md(yd[0])} GMV`,eok(yd[2]),`타겟 ${eok(yd[1])} · 달성 <b class="${ydRate>=1?'up':'dn'}">${pct(ydRate)}</b> · YoY <b class="${cls(yd[4])}">${pct(yd[4],true)}</b>`],
    ['누적 순매출',eok(nrev),`순매출 타겟 ${eok(nrevT)} · 달성 ${pct(nrevT?nrev/nrevT:0)} · TR <b>${pct(TR)}</b> (타겟 ${pct(TRT)})`],
    ['CR 사용액 (누적)',eok(D.tot.CR),`GMV 대비 <b class="${D.tot.CR/G>0.1?'warn':''}">${pct(D.tot.CR/G)}</b> · GMKT CR ${eok(D.tot.G)}`],
    [`당일 실시간 ${rtRow?md(rt[0]):''}`,rtRow?eok(rt[2]):'-',rtRow?`타겟 ${eok(rt[1])} · 진행 ${pct(rt[1]?rt[2]/rt[1]:0)} · 전년 동요일 ${eok(rt[3])}`:'실시간 데이터 없음'],
  ];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="card kpi"><h3>${x[0]}</h3><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('');
  const rows=shown.concat(rtRow?[rtRow]:[]); const W=820,H=240,pl=40,pb=28,pt=10; const mx=Math.max(...rows.map(r=>Math.max(r[1],r[2])))*1.1||1;
  const bw=(W-pl-10)/rows.length; const y=v=>pt+(H-pt-pb)*(1-v/mx);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">`;
  for(let i=0;i<=4;i++){const v=mx*i/4;svg+=`<line x1="${pl}" x2="${W-5}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${Math.round(v/1000)}</text>`;}
  rows.forEach((r,i)=>{const x=pl+i*bw; const isRt=rtRow&&r===rtRow; svg+=`<rect x="${x+bw*0.15}" y="${y(r[2])}" width="${bw*0.7}" height="${H-pb-y(r[2])}" fill="${isRt?'#fbbf24':(r[2]>=r[1]?'#60a5fa':'#93c5fd')}" rx="2"><title>${md(r[0])} 실적 ${mm(r[2])} / 타겟 ${mm(r[1])}</title></rect>`;
    svg+=`<text x="${x+bw/2}" y="${H-pb+12}" text-anchor="middle">${mdShort(r[0])}</text>`; const rate=r[1]?r[2]/r[1]:0; svg+=`<text x="${x+bw/2}" y="${H-pb+23}" text-anchor="middle" fill="${rate>=1?'#059669':'#dc2626'}">${Math.round(rate*100)}%</text>`;});
  let path=''; rows.forEach((r,i)=>{path+=(i?'L':'M')+(pl+i*bw+bw/2)+','+y(r[1])+' ';}); svg+=`<path d="${path}" fill="none" stroke="#1f2937" stroke-width="2"/>`;
  rows.forEach((r,i)=>{svg+=`<circle cx="${pl+i*bw+bw/2}" cy="${y(r[1])}" r="3" fill="#1f2937"/>`;});
  document.getElementById('dailyChart').innerHTML=svg+'</svg>';
  let t=`<table><thead><tr><th class="l">일자</th><th>타겟(백만)</th><th>실적(백만)</th><th>달성율</th><th>부족분</th><th>전년(백만)</th><th>YoY</th><th>TR</th></tr></thead><tbody>`;
  rows.forEach(r=>{const rate=r[1]?r[2]/r[1]:0, yoy=(r[2]&&r[3])?r[2]/r[3]-1:0, isRt=rtRow&&r===rtRow; t+=`<tr class="${isRt?'rt':''}"><td class="l">${md(r[0])}${isRt?' <span class="tag">실시간</span>':''}</td><td>${mm(r[1])}</td><td><b>${mm(r[2])}</b></td><td>${barH(rate)}</td><td class="${r[1]-r[2]>0?'dn':'up'}">${mm(r[1]-r[2])}</td><td>${mm(r[3])}</td><td class="${cls(yoy)}">${pct(yoy,true)}</td><td>${pct(r[4])}</td></tr>`;});
  const sT=shown.reduce((a,r)=>a+r[1],0), sG=shown.reduce((a,r)=>a+r[2],0), sP=shown.reduce((a,r)=>a+r[3],0);
  t+=`<tr class="tot"><td class="l">누적 (${mdShort(D.m.ms)}~${mdShort(D.m.b)})</td><td>${mm(sT)}</td><td>${mm(sG)}</td><td>${barH(sT?sG/sT:0)}</td><td class="${sT-sG>0?'dn':'up'}">${mm(sT-sG)}</td><td>${mm(sP)}</td><td class="${cls(sG/sP-1)}">${pct(sP?sG/sP-1:0,true)}</td><td>${pct(cum[5])}</td></tr></tbody></table>`;
  document.getElementById('dailyTable').innerHTML=t;
  const cats=D.cats.filter(c=>c[2]>0||c[1]>0).sort((a,b)=>b[2]-a[2]); const cT=cats.reduce((a,c)=>a+c[2],0); const hasPy=cats.some(x=>x[1]);
  let c=`<table><thead><tr><th class="l">카테고리</th><th>GMV(백만)</th><th>비중</th>${hasPy?'<th>전년(백만)</th><th>YoY</th>':''}</tr></thead><tbody>`;
  cats.forEach(x=>{c+=`<tr><td class="l">${esc(x[0])}</td><td>${mm(x[2])}</td><td>${pct(cT?x[2]/cT:0)}</td>${hasPy?`<td>${mm(x[1])}</td><td class="${cls(x[2]/x[1]-1)}">${x[1]?pct(x[2]/x[1]-1,true):'-'}</td>`:''}</tr>`;});
  document.getElementById('catTable').innerHTML=c+'</tbody></table>';
  const tt=D.tot; const crRows=[['바이어 CR',tt.B],['아이템 CR',tt.I],['PCS CR',tt.P],['마케팅 CR',tt.M],['GMKT CR',tt.G]];
  document.getElementById('crTot').innerHTML=`<table><tbody>${crRows.map(r=>`<tr><td class="l">${r[0]}</td><td>${mm(r[1])}</td><td>${pct(tt.CR?r[1]/tt.CR:0)}</td></tr>`).join('')}<tr class="tot"><td class="l">총 CR</td><td>${mm(tt.CR)}</td><td>GMV 대비 ${pct(tt.CR/G)}</td></tr></tbody></table>`;
  const saRows=[['총 광고비(AD_AMNT)',tt.AD],['CPC',tt.CPC],['CPP',tt.CPP],['AI',tt.AI]];
  document.getElementById('saTot').innerHTML=`<table><tbody>${saRows.map(r=>`<tr><td class="l">${r[0]}</td><td>${mm(r[1])}</td><td>${r[0].startsWith('총')?'GMV 대비 '+pct(tt.AD/G):pct(tt.AD?r[1]/tt.AD:0)}</td></tr>`).join('')}<tr class="tot"><td class="l">광고 ROAS (GMV/광고비)</td><td colspan="2">${tt.AD?(G/tt.AD).toFixed(1)+'x':'-'}</td></tr></tbody></table>`;
  document.getElementById('links').innerHTML=`<table><tbody>${D.links.filter(l=>l.g||l.a).map(l=>`<tr><td class="l">${esc(l.name)}</td><td class="l">${l.g?`<a href="${esc(l.g.trim())}" target="_blank">지마켓</a>`:''} ${l.a?`<a href="${esc(l.a.trim())}" target="_blank">옥션</a>`:''}</td></tr>`).join('')}</tbody></table>`;
  const P=[];
  P.push(`<b>누적 달성율 ${pct(G/T)}</b> vs 월 진척 ${pct(D.progress)} → ${G/T>=D.progress?'<span class="up">페이스 양호</span>':`<span class="dn">페이스 대비 ${eok((D.progress-G/T)*T)} 부족</span>`}. 일할타겟 기준 달성 ${pct(cumRate)}.`);
  P.push(`전일 ${md(yd[0])}: 달성 <b class="${ydRate>=1?'up':'dn'}">${pct(ydRate)}</b>, YoY <b class="${cls(yd[4])}">${pct(yd[4],true)}</b>. ${ydRate<0.9?'평일 타겟 미달 — 상위 셀러 전일 실적 확인 필요.':'타겟 수준 유지.'}`);
  const lag=D.s.filter(s=>s.T>=20000).sort((a,b)=>(a.pace-b.pace)).slice(0,5);
  P.push(`<b>페이스 하위 셀러</b> (월타겟 2천만↑, 일할타겟 대비): ${lag.map(s=>`${esc(s.n)} <span class="dn">${pct(s.pace)}</span>`).join(', ')}`);
  const gapTop=D.s.slice().sort((a,b)=>(b.cumT-b.C)-(a.cumT-a.C)).slice(0,5);
  P.push(`<b>일할타겟 부족금액 Top5</b>: ${gapTop.map(s=>`${esc(s.n)} ${eok(s.cumT-s.C)}`).join(', ')}`);
  const good=D.s.filter(s=>s.C>=1000).sort((a,b)=>b.pace-a.pace).slice(0,3);
  P.push(`<b>페이스 상위</b>: ${good.map(s=>`${esc(s.n)} <span class="up">${pct(s.pace)}</span>`).join(', ')}`);
  const crHi=D.s.filter(s=>s.C>=3000&&s.crR>0.12).sort((a,b)=>b.crR-a.crR).slice(0,5);
  if(crHi.length) P.push(`<b>CR율 12% 초과</b>: ${crHi.map(s=>`${esc(s.n)} <span class="warn">${pct(s.crR)}</span>`).join(', ')} — 쿠폰 효율 점검.`);
  const noSale=D.s.filter(s=>s.ydGmv===0&&s.T>=10000);
  if(noSale.length) P.push(`<b>전일 매출 0원</b> (타겟 1천만↑): ${noSale.map(s=>esc(s.n)).join(', ')}`);
  document.getElementById('points').innerHTML=P.map(x=>`<li>${x}</li>`).join('');
}
// ---------- sellers ----------
let selName=null;
function renderSellers(){
  let rows=D.s.filter(s=>!qtxt||(s.n+' '+s.g+' '+s.a).toLowerCase().includes(qtxt));

function parseKam(wb){

  for(const sh of wb.SheetNames.filter(n=>/딜실적|월 실적/.test(n))){const ws=wb.Sheets[sh]; const c=dealCols; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    for(let i=c.h;i<rows.length;i++){const r=rows[i]; const dt=String(r[colIdx(c.d)]); if(!dt.startsWith(pfx))continue; const code=String(r[colIdx(c.code)]); const nm=String(r[colIdx(c.nm)]); let b=code2biz[code]; if(!b){const s=D.s.find(x=>nm.includes(x.n)); b=s&&s.b;} if(!b)continue; const key=b+'|'+dt+'|'+code; if(seen.has(key))continue; seen.add(key);
      const s=D.s.find(x=>x.b===b); const slot=[r[colIdx(c.k)],r[colIdx(c.kd)]].filter(x=>x!=='').join(' / ')||'일반딜'; s.dl.push([dt,slot,nm.slice(0,24),k(r[colIdx(c.gmv)])]);}}
  D.s.forEach(s=>s.dl.sort((a,b)=>a[0]<b[0]?-1:1)); D.pdates=[...dateSet].sort();
}
async function readWb(file,sheets){const buf=await file.arrayBuffer(); return XLSX.read(buf,{type:'array',cellDates:false,sheets});}
document.getElementById('fKam').onchange=async e=>{const f=e.target.files[0]; if(!f)return; try{status(`${f.name} 읽는 중… (RAW 시트가 커서 수십 초 걸릴 수 있음)`); await new Promise(r=>setTimeout(r,50)); const wb=await readWb(f,['데일리타겟','1. Daily','주력관리코드','사업자 실적 RAW']); const nd=parseKam(wb); const old=D; D=nd; if(old&&old.pdates&&old.pdates.length){D.s.forEach(s=>{const o=old.s.find(x=>x.b===s.b&&x.n===s.n); if(o){s.pg=o.pg;s.pc=o.pc;s.pr=o.pr;s.dl=o.dl;}}); D.pdates=old.pdates;} renderAll(); status(`✔ ${f.name} 반영 완료 (기준일 ${md(D.m.b)}, 셀러 ${D.s.length}개) → 다음 ② 상품 관리파일`);}catch(err){status('오류: '+err.message,true);console.error(err);} e.target.value='';};
document.getElementById('fProd').onchange=async e=>{const f=e.target.files[0]; if(!f)return; try{status(`${f.name} 읽는 중…`); await new Promise(r=>setTimeout(r,50)); const wb=await readWb(f); parseProd(wb); renderAll(); status(`✔ ${f.name} 반영 완료 (상품 데이터 ${D.pdates.length}일치)`);}catch(err){status('오류: '+err.message,true);console.error(err);} e.target.value='';};
// ---------- init ----------
if(D){renderAll();} else {status('① KAM 실적 파일(★KAM 실적_홍서하_4Q.xlsx)을 먼저 불러오세요');}
